description: Unauthorized error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 401
        message:
          type: string
          example: UnauthorizedError
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: 'Unauthorized'
              

# OpenAPI type Değerleri

# string 
# number
# integer → Tam sayılar 
# boolean
# array → Birden fazla veri içeren diziler 
# object → Birden fazla alan içeren nesneler 
